            { impa: "851513", name: "Iso-Butane (C4H10) - 50% LEL", volume: "58 Lít (CAN)", specs: "0.75% VOL Iso-Butane, Balance Air" },

        const thead = document.getElementById("tableHead");
        const tbody = document.getElementById("tableBody");

        // Chuyển đổi tab hoạt động
        function switchTab(tab) {
            activeTab = tab;
            
            // Thay đổi trạng thái hiển thị của nút Tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tab + 'TabBtn').classList.add('active');
            
            // Reset ô tìm kiếm
            document.getElementById("searchInput").value = "";
            document.getElementById("noResult").style.display = "none";
            
            // Tạo lại Header và hiển thị dữ liệu tương ứng
            if (tab === 'tubes') {
                thead.innerHTML = `
                    <tr>
                        <th width="12%">Mã IMPA</th>
                        <th width="20%">Loại Khí / Hóa chất</th>
                        <th width="34%"><span class="section-header draeger-header">Thông số Dräger (Mẫu 2024)</span></th>
                        <th width="34%"><span class="section-header gastec-header">Mã Gastec đề xuất phù hợp</span></th>
                    </tr>
                `;
                renderTubesTable(tubeDatabase);
                document.getElementById("searchInput").placeholder = "Tìm kiếm nhanh bằng: Mã IMPA, Mã Dräger, Mã Gastec hoặc Tên khí...";
            } else {
                thead.innerHTML = `
                    <tr>
                        <th width="15%">Mã IMPA</th>
                        <th width="30%">Tên Khí / Hỗn hợp khí</th>
                        <th width="20%">Dung tích chai</th>
                        <th width="35%">Thông số thành phần (Concentration & Balance)</th>
                    </tr>
                `;
                renderSpanGasTable(spanGasDatabase);
                document.getElementById("searchInput").placeholder = "Tìm kiếm bằng: Mã IMPA (VD: 851584), Tên khí (VD: Oxygen, 4-Gas)...";
            }
        }

        // Render bảng Tubes (Nhóm 33)
        function renderTubesTable(dataList) {
            tbody.innerHTML = "";
            dataList.forEach(item => {
                const tr = document.createElement("tr");
                const dListHtml = item.dSpecs.map(spec => `<li>${spec}</li>`).join("");
                const gListHtml = item.gSpecs.map(spec => `<li>${spec}</li>`).join("");

                tr.innerHTML = `
                    <td><span class="badge-impa">${item.impa}</span></td>
                    <td><span class="gas-name">${item.gas}</span></td>
                    <td>
                        <div><span class="badge-draeger">${item.dCode}</span> <strong>${item.dName}</strong></div>
                        <ul class="detail-list">${dListHtml}</ul>
                    </td>
                    <td>
                        <div><span class="badge-gastec">${item.gCode}</span> <strong>${item.gName}</strong></div>
                        <ul class="detail-list">${gListHtml}</ul>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Render bảng Span Gas (Nhóm 85)
        function renderSpanGasTable(dataList) {
            tbody.innerHTML = "";
            dataList.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><span class="badge-spangas">${item.impa}</span></td>
                    <td><span class="gas-name">${item.name}</span></td>
                    <td><strong>${item.volume}</strong></td>
                    <td><em>${item.specs}</em></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Khởi động bảng lần đầu tiên ở chế độ 'tubes'
        switchTab('tubes');

        // Hàm lọc tìm kiếm đồng thời cho cả hai Tab
        function filterTable() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            const queryNoSpaces = query.replace(/\s+/g, '');

            if (activeTab === 'tubes') {
                const filteredData = tubeDatabase.filter(item => {
                    const impaMatch = item.impa.toLowerCase().includes(query);
                    const dCodeMatch = item.dCode.toLowerCase().includes(query);
                    const gCodeNormalized = item.gCode.toLowerCase().replace(/\s+/g, '');
                    const gCodeMatch = gCodeNormalized.includes(queryNoSpaces);
                    const gasMatch = item.gas.toLowerCase().includes(query);
                    const dNameMatch = item.dName.toLowerCase().includes(query);
                    const gNameMatch = item.gName.toLowerCase().includes(query);

                    return impaMatch || dCodeMatch || gCodeMatch || gasMatch || dNameMatch || gNameMatch;
                });

                if (filteredData.length > 0) {
                    document.getElementById("noResult").style.display = "none";
                    renderTubesTable(filteredData);
                } else {
                    tbody.innerHTML = "";
                    document.getElementById("noResult").style.display = "block";
                }
            } else {
                const filteredData = spanGasDatabase.filter(item => {
                    const impaMatch = item.impa.toLowerCase().includes(query);
                    const nameMatch = item.name.toLowerCase().includes(query);
                    const specMatch = item.specs.toLowerCase().includes(query);

                    return impaMatch || nameMatch || specMatch;
                });

                if (filteredData.length > 0) {
                    document.getElementById("noResult").style.display = "none";
                    renderSpanGasTable(filteredData);
                } else {
                    tbody.innerHTML = "";
                    document.getElementById("noResult").style.display = "block";
                }
            }
        }
    </script>
